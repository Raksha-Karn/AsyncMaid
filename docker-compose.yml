services:
  redis:
    image: redis:7-alpine

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskqueue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: >
      sh -c "uv run alembic upgrade head &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    container_name: taskmaid-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app
      - storage_data:/storage

  worker:
    build: .
    command: uv run celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app
      - storage_data:/storage

volumes:
  postgres_data:
  storage_data:
